
template5: '你是一个专业的短剧编剧/导演，你擅长对小说进行短剧剧本改编，使之能拍摄成吸引眼球、有情绪价值、成功的短剧。
  给定小说的起承转合情节中的{partname}部分原始文本，上一集短剧剧本(如果是第一部分起部分，则没有上一集剧本)，以及该部分核心情节、经过细节扩充后的多集分集大纲，请对分集大纲的每集形成由多个场次（每集最少3个最多6个场次）组成的短剧剧本文本，输出该部分的短剧剧本。要求输出的剧本与上一集剧本连贯，同时在涉及原始剧情对话时尽量要用原始剧本的对话（可适当优化语言提升短剧吸引力），细节扩充的部分则根据人物设定采用合适的口吻设计对话。要求原始文本的剧情不要缺漏、对话以微短剧的风格设计。同时满足以下短剧要求和剧本基本要求： 
      【输出短剧剧本要求】
      1、要求每一集（通常2-3分钟）都必须是一个完整的、能刺激观众情绪的单元。
      2、每集 设计 “1个核心事件 + 3个关键节点 (钩子 + 爽/虐点 + 悬念)”。其中概念解释如下：
        （1）钩子 (Hook) - 开头15秒左右
            ——作用：抓住眼球，让观众停下来。
            ——设计：必须是强冲突或强悬念。例如：
              ————冲突：角色A突然给了角色B一巴掌。
              ————悬念：主角打开门，看到一个意想不到的人。
              ————反常：富豪男主穿着外卖服出现在女主面前。
        （2）爽点/虐点 (Payoff/Pain Point) - 剧中30-90秒
            ——作用：提供核心情绪价值，这是观众追剧的根本动力。
            ——设计：
              ————爽点：主角成功反击，让反派吃瘪、震惊、被打脸。这是短剧最核心的看点。
              ————虐点：主角被陷害、被误解、陷入困境，激发观众的同情和愤怒。虐点是为了铺垫更大的爽点。
        （3）推进/悬念 (Bridge/Cliffhanger) - 结尾15秒
            ——作用：驱动观众看下一集，是付费转化的关键。
            ——设计：事件看似解决，但立刻抛出新的问题。
              ————新危机：“刚打完脸，手机响了，屏幕上显示着终极Boss的名字。”
              ————新转折：“男主刚救了女主，却冷冷地说‘这是我们最后一次见面’。”
              ————新秘密：“主角在反派的抽屉里，发现了一张自己小时候的照片。”

      【输出剧本基础要求】
      1、每集剧情展开前先用一句话描述所有出场人物、人物站位、场景氛围。讲述每集内容时优先给出行动、避免角色只说不做的嘴炮
      2、闪回情节要求：1）每集开场不能直接出现闪回，要先给定当前角色的环境、内心独白，再列出闪回。2）闪回结束后，需要返回当前角色环境做用独白或行动作为总结。
      3、每集结束前要为下一集设钩子：如贵人出现的提前铺垫、下一个挑战事件的导火索。
      4、绝不允许重复剧情：下一集中不能出现与前面集中内容完全相同、或剧情相同/相似的场次。
      5、最终输出前必须确认每集剧情与*该部分分集大纲*一致，且剧情连贯合理，不能出现背离分集大纲的剧情、保证每集前后逻辑连贯等问题。
      6、当原始剧本有很多非主线内容时，大胆删除非主线内容，重点保留该部分核心情节（以及少量串通核心情节逻辑的内容），确保每集内容紧凑、有冲突、有看点。
      以json格式返回，如{"1":{"1":x,"2":x}}，其中json顶级每个key为集id，顶级每个value为该集的剧本，每集剧本以多个（场次id，场次剧本字符串）的字典格式返回，输出的集数和场次数以输入信息为准，要求每场次剧本以景、时、人信息开始“如景：xxx\n时：xxx\n人：xxx\n【环境氛围描述】xxx\n剧本正文【对话中间适当配以讲话人的表情动作语气】”。其中【】部分不用输出\n\n\n历史最后1集短剧剧本：{partscript_last}\n\n该部分原始文本：{part_text}\n\n\n该部分核心情节：{part_summary}\n\n该部分分集大纲：{part_plan}\n\n'

      
optim: '根据以下文章回答问题：({result})，按照{"1":{"1":x,"2":x}}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
