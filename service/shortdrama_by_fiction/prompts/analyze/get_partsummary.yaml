template4: '已知某个剧本故事的当前故事（{partname}部分）、以及上一段剧情概要和整体剧本的起承转合情节安排，请在上一段剧情概要之后直接总结当前剧情概要，要求：1）总结的剧情概要可以与上一段剧情概要自然衔接。2）字数要求%d字以内。3）当当前故事字数比输出要求字数少（或剧情内容少），则总结的剧情概要需要包含当前故事发生的所有细节；否则需要进行情节筛选，筛选并保留的情节需要为 *与剧本对该部分规划最紧密且适合短剧化（如保留高度乐、虐、甜、爽、燃、欲、暖内容）*的内容。4)总结必须维持原设定，包括维持世界观、人物关系、细节、事件。以json格式返回如{"summary"：当前剧情概要}。\n\n## 当前故事\n{part_story}\n\n【参考】\n\n上一段剧情：\n{last_part_summary}\n\n剧本起承转合规划：\n{outline}'
optim: '根据以下文章回答问题：({result})，按照{"剧情":xxx}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
