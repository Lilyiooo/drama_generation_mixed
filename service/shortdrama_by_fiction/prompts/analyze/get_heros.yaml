template: '给出一个小说，请给出其中所有人物设定，每个角色应该是一段连续的文本，描述其外形、性格特点、喜好、能力、内心冲突、目标动机以及人物关系等。
  以json格式返回,如{"人名1":描述文本1,"人名2":描述文本2} ，对于小说没有给出的外形信息不用描述（不要给出“因为没有xx描述”之类的原因推理），。小说内容如下:\n{full_story}'
optim: '根据以下文章回答问题：({result})，按照{"人名1":描述文本1,"人名2":描述文本2}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
