template10: '给定小说当前第{eps_id}集剧本，以及参考资料：全剧剧情概要、{partname}部分的分集大纲、上一集剧本、人设、{partname}部分的原著文本，请根据这些信息对当前剧本进行精修（重点：只做语言措辞上的优化，不准增加、删除故事内容），在不改变原剧本剧情的前提下进行措辞优化的精修，要求润色后剧本更符合下面条件：
      1、外显动作表达简洁，指令清晰（从而可直接用于拍摄）。如采用“鹿鸣于出现”代替“鹿鸣于心里一惊，但她很快镇定下来，出现在众人面前”。
      2、采用剧本语言直接的“视觉叙事”，不要进行心理情绪描绘、不要抽象描述（气味/氛围等）、或采用比喻拟人等艺术手法。通过简洁的动作和画面讲故事，
        如采用“我哈哈大笑，他咆哮”来代替“我很愉快，他很不开心。”
        用 “女主惊讶，瞳孔骤缩” 替代 “女主很惊讶”，
        用“她得意地眉毛一挑”代替“她非但不怕，反而像一只偷到腥的猫，眉毛得意地一挑”
        用“风吹起她的长发” 代替“刚才还剑拔弩张的空气瞬间变得空旷而宁静，微凉的夜风吹起她的长发，带走了空气中最后一丝燥热。”
      3、不要改变镜头快切或多个镜头一起出现的剧本形式：对于一组镜头快切/一组闪回快切等剧情保持原有形式
      3、短剧式人物对话优化
        1）拆解长对话，避免 “念台词” 感。注意不需要画蛇添足地增加镜头信息，如（xx特写、中景、近景等）字眼。
        2) 语言利索，采用直白的短剧化口吻，如用“睡一个？”代替“你愿意和我睡一晚吗？”
      4、对话间插入的动作/其他推进描述不得超过15个字，
      5、参考以下样例，每场剧本在开头“景时人”信息之后有一段以△开头的短剧式简洁环境渲染（环境渲染包括：场景/氛围/人物状态或情绪动作/人物间相对位置的描述），在中间对话需要时有限加入以△开头的人物状态随剧情推进变化的描述。
      参考样例1:
        “景：酒店内
        时：日
        人：詹祥、段休冥、鹿鸣于、主持人、两位新人、宾客
        △高级酒店婚礼现场，宾客拿着高脚杯窃窃私语。段休冥身穿浴袍。
        主持人：让我们掌声欢迎两位新人入场。
        詹祥：哥，你穿浴袍来参加婚礼。
        段休冥：怎么？嫌我丢了你暗脉文将的脸？
        詹祥：哥。咱们这是在外地，你这么高调，我害怕。
        段休冥：行，那我不下去了。
        詹祥笑笑
        主持人：请两位新人交换戒指。
        二人望向楼下新人结婚
        鹿鸣于出现
        詹祥：好乖呀。就是衣服有点不太合适。哥。我先下去看看，一会儿回来。
        段休冥示意让他离开
        鹿鸣于被带路人推入画室
        带路人：听说你很会画画，那你画婚礼现场，不画完不准出来。
        段休冥观察鹿鸣于
        段休冥os：这么听话，一点灵魂也没有，无趣。
        鹿鸣于开始坐下画画
        主持人：新郎可以亲吻新娘了。
        段休冥：喜气沾完了我也该走了。
        段休冥看着鹿鸣于画的画
        段休冥：漂亮。
        鹿鸣于os：这具身体还不错。
        鹿鸣于：单身？
        段休冥点头
        段休冥：是
        鹿鸣于扔掉画笔
        鹿鸣于：睡一个。
        段休冥：什么？”

      参考样例2:
        “景：内景-简陋寝殿(回忆)
        时：夜
        人：刘琰，小乔，侍卫甲
        画面逐渐清晰，小乔面露疲惫，双眼紧闭，侧卧在床上。
        △琰面带微笑，眼中闪烁着异样的光芒，俯身靠近小乔。
        刘琰：蔓蔓，你醒了。
        画面瞬间切换，刘琰眼神狰狞，面部被阴影笼罩。
        刘琰：蔓蔓，跟朕一起死吧。
        小乔猛地睁开眼睛，发出短促的惊呼。
        小乔：(惊呼)
        小乔撑起身子，发现双手被粗麻绳紧紧捆绑。
        小乔：你要干什么？
        △琰看着小乔，眼神中带着一丝偏执。
        刘琰：蔓蔓，那魏贼欺人太甚。
        刘琰：我听闻此事岂能弃你不管？
        △琰用绳索缠绕小乔的手腕，将其绑缚得更紧。
        小乔：你就是这么救我的吗？
        △琰的双手继续缠绕着绳索，动作略显急促。
        刘琰：事情紧急，我怕你乱跑，不小心伤到自己。
        屋外传来急促的脚步声。
        侍卫甲：(画外音，焦急)报！世子，魏劭带人已攻到城下了！
        △琰闻言，猛地起身，转身走向前方。
        刘琰：来得正好。
        △琰转过身，手中拿着一个引信状的物品，眼神中充满狠厉。
        刘琰：城中早已铺满炸药，只要他敢进城，我必让他尝尝粉身碎骨的滋味。
        侍卫甲：(画外音)那属下先去疏散百姓。
        △琰挥手制止侍卫甲。
        刘琰：不必。百姓的命，若能换魏劭的命，那是他们的福气。
        小乔坐在床上，看着刘琰的背影，眼神复杂。
        小乔：(VO)他还是和上一世一样卑鄙。
        △琰重新走到小乔身边，温柔地解开她手上的绳索。
        刘琰：蔓蔓，你在此安心等我，等我解决了魏贼，便回来与你完婚。
        小乔眼神中闪过一丝坚定。
        ”
      8、最终输出的剧本必须去除“特写”、“音效”等标记字眼，同时去除每个镜头的景别设置（如不要有“[中景]”、“近景”等字样）
      以json格式返回，{"script":{"场次id":剧本文本}}，script的value为以多个（场次id，场次剧本字符串）的字典格式返回，输出的场次id从1开始，剧本文本为以“景：x\n时：x\n人:x\n”开头的剧本字符串。纯中文剧本，不能出现英文，除了“内心OS”。\n\n\n当前第{eps_id}集剧本：{eps_script}\n\n\n------【参考资料】------\n\n{partname}部分原著文本：{part_text}\n\n上一集剧本：{last_eps_script}\n\n人设：{heros_str}\n\n{partname}部分分集大纲：{part_summ_list}\n\n全剧剧情概要：{full_story}'
        # 不要加镜头远近描述“特写”
optim: '根据以下文章回答问题：(%s)，按照{{"script":{"场次id":剧本文本}}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，其中剧本文本为以“景：x\n时：x\n人:x\n”开头的剧本字符串（剧本的格式参考上述内容）。只回答json内容，不回答无关信息'
    