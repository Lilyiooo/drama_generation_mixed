# 13+ ”curr_summ采用目前的集数规划，基于此做新的集数规划“+”同时输入历史的集数规划作为参考“，采用episodeplan的能力
template15: '对一部小说，要生成1部  {num_episode} 集，每集 {min_perepisode} 分钟 的短剧剧本，请根据以下起承转合4部分故事的分析，对每部分故事分别生成对应的分集提纲。
  已知小说世界架构、人设、上一部分分集提纲（若无则为空）、当前（ {partname} 部分）剧情，以及对针对当前剧情初步的集数规划，请根据目标短剧生成要求，根据当前剧情的集数规划产生当前剧情的分集提纲，最终输出的分集提纲：满足下列条件、且与上一部分分集提纲自然衔接的分集提纲（注意不是全集提纲），该部分的集数要与输入的该部分总集数一致，要求输出的故事提纲要满足短剧爆款要求。
      其中：每集3场次的（不超过6句话，每1-2句话代表1个场次剧情，当剧情内容过多时某些集场次数可增加但单集不超过5场次）
      以json格式返回，如{"提纲":xxxx}，其中提纲部分采用列表分点列出，列表中每项为1集内容，每集有6句以内以句号为划分的话，如["第1集：xxx。","第2集：xx"]。仅返回新的提纲结果，不要解释，不要带```json等格式字样。若有上一部分分集提纲，本部分优化的分集提纲的集数需要在上一部分的集数之后继续生成。
      要求：
      【整体要求】
      1) 整体剧本节奏极快，钩子密而多，每集都有明确的冲突和强有力的“卡点”，注重视觉呈现，最大化留存观众；
      2）要求情节环环相扣，几乎没有废戏；人物弧光与行为逻辑上，要求人物心路历程清晰，行为转变的逻辑链条完整，人物每个阶段的冲突、转折和角色心态变化都有清晰的展现和递进；
      3）把握黄金3秒，开篇即展示高虐/反杀/高甜/高欲，并尽量在极短的篇幅内高效地完成了世界观构建、人物关系介绍、核心设定抛出和主线矛盾建立。
      ——对于开篇重生类型IP，必须保留重生前后矛盾，可用镜头快切切换来到今世。
      4）满足短剧“即时反馈”的原则，钩子多采用“事件型”视觉呈现；对于重复、类似场景多次出现，可可以设计镜头块切，在极短的篇幅内传递了大量有效信息和情节转折

      【故事内容要求】
      1）对于短故事或当前剧情量不足时：要丰富当前剧情的视觉呈现。
        ————最终提纲需要包含当前部分剧情的所有情节，
        ————增加重场戏：在不改变当前剧情关键节点和结局前提下，解决增加符合人物矛盾冲突的重场戏，使得爽点和钩子贯穿始终，持续吸引观众；如优先扩展核心人物（如男女主间）对核心矛盾或冲突推进有帮助、且带强力情绪冲击的故事情节（一些高光高亮高情绪价值的常见戏剧性情节等）。
        ————其次可以丰富一些本部分情节的适合短剧化的视觉/行为/事件设计（如角色互动动作、挑衅的话、角色暧昧表情或言语、与人设和当前情节相关的行为）。
        ————增加的戏需要前后逻辑合理，通过内心OS正确合理化人物前后情绪或矛盾选择。
      2）当前剧情量（当前部分）超过规划集数的短剧剧情量内容时：大胆丢弃无关的支线剧情或支线人物发展使得更满足爆款短剧要求（遇到不可丢弃的支线，仅需简单带过保证主线连贯即可）。确保每集内容不超过5场次（最好只有3场），并保留核心情节和冲突。要求剧情压缩后尽量保留更适合短剧化的情节（如高度乐、虐、甜、爽、燃、欲、暖的情节），删减掉一些不适合短剧化的情节（如过于平淡的日常生活细节，过于冗长的事件过程、支线和配角的情感发展等）。但必须保证输出部分剧情有逻辑，不要发展突兀。
      3）注意只给出该部分提纲，且必须与给定的剧情一致，不能预测未来的行为、或推进没给出的剧情，不要提前泄漏小说后面的内容，不要破坏小说总体世界架构和人设。
      当原始小说内容特别多（比当前剧情多时）丰富的细节可以来自原始小说内容，但挑选细节时需要在保持当前剧情连贯逻辑合理下、挑选更具备冲突性或可以调动观众情绪的细节填充当前剧情。
      4）输出的核心故事要在当前剧情范围内，不可以泄漏后续小说故事情节内容，但可以大胆发挥想象。
      
      【输出前最后检查】
      1）最后对输出进行检查，必须保证输出部分剧情有逻辑，前后集间内容不冗余，支线故事不要连续出现超过1集，不要发展突兀，且必须在当前剧情范围内，不要泄漏小说故事后续。当不符合时进行优化再输出，优化点包括：
      ————（1）把握黄金3秒，开篇即展示高虐/反杀/高甜/高欲等，第一集第2场之前必须有钩子，如突发危机、强情绪点、悬念，杜绝慢节奏铺垫或嘴炮
      ————（2）单集只围绕一个核心主题、在重要人物间发生，具有替代功能的次要人物情节删除，注意连续支线剧情（即男女主不同场的剧情）尽量不超过1集。
      ————（3）每集必须有**主角行动**或**促进主角思想转变的高刺激外部行为**，同时伴随核心矛盾推进解决或情绪转化，说话不是行为，故单集不能为角色间纯对话或独白。
      ————（4）每个小事件需要闭环或有限留白：要么清晰解决核心冲突，要么留适度留白，避免 “烂尾” 或 “过度开放式”，保证观众有明确的情绪落点。
      ————（5）规避 “时间 / 空间” 矛盾：确保前后集或所有前后场次的剧情时间线清晰；确保空间位置（如对男主住所采用相同描述词如“高档公寓”，而非交替使用“出租屋”、“高档公寓”）清晰，避免观众混淆。
      ————（6）补充 “必要铺垫”，避免 “突兀转折”：剧情反转或关键情节（如 “反派突然变好”“贵人突然相助”）需提前铺垫，不能凭空出现。前后集之间的剧情转折也需有合理过渡，避免观众感到剧情突兀。
      ————（7）删减 “冗余信息”，避免 “信息过载”：删除与主线无关的支线情节或人物，避免观众分心。

      【爆款短剧要求】
      1、对起承转合各阶段的要求
        第一阶段：起 (Introduction) - 约1/5集（如对于50集短剧占10集）
            核心目标：快速入局，抛出核心矛盾。 必须在最短时间内让观众明白：主角是谁？他/她想要什么？最大的障碍是什么？
            集数规划与关键节点：
            第1-2集 (黄金开局)：必须在第1集的前30秒内引爆第一个强冲突。 例如：女主开局就被丈夫和闺蜜背叛/被家族扫地出门/发现自己身患绝症。这部分要快、准、狠，迅速建立观众对主角的同情和对反派的憎恨。
            第3-5集 (确立目标)：主角从最初的打击中缓过神来，确立一个初步的、明确的目标。例如：“我要复仇！”、“我要在三个月内赚到100万！”、“我要找到真相！”。同时，关键人物（如神秘男主、忠心盟友）登场，给予主角初步帮助或提出更具诱惑的条件。
            第6-10集 (初尝胜果与新危机)：主角利用新获得的能力或帮助，完成第一次“打脸”或小规模逆袭，获得第一个“小爽点”，让观众看到希望。但胜利之后，立刻引出更强大的对手或更复杂的危机，为“承”阶段铺路。
          第二阶段：承 (Development/Elaboration) - 约3/10集（如对于50集短剧占11~25集）
            核心目标：升级打怪，爽点密集。 这是故事的主体部分，主角在追求目标的道路上不断清除障碍，能力和地位持续上升。
            集数规划与关键节点：
            节奏：这个阶段是“爽点”最密集的区域。基本保持 3-5集解决一个中级反派或完成一个阶段性目标 的节奏。
            事件设计：设计一系列“打脸”事件。例如：职场上，主角搞定一个又一个刁难的客户和同事；复仇中，主角让一个个欺负过她的配角付出代价。
            感情线发展：主角与核心盟友（通常是男主）的关系在此阶段通过共同经历危机而升温，从互相试探到建立信任。
            第25集左右 (中点事件/假高潮)：设置一个重大的转折点。主角可能取得了阶段性的巨大胜利（例如，扳倒了一个重要敌人，几乎要成功了），让观众以为故事将走向结尾。这通常是一个“假高潮”。
          第三阶段：转 (Turn/Climax) - 约7/20集(如对于50集短剧占26~42集)
            核心目标：矛盾激化，置之死地而后生。 故事急转直下，主角遭遇前所未有的危机，所有矛盾集中爆发。
            集数规划与关键节点：
            第26-32集 (危机降临)：“假高潮”之后，幕后黑手或终极Boss开始发力，主角的计划被识破，或者被最信任的人背叛，瞬间从顶峰跌入谷底。这是故事的“至暗时刻”。
            第33-37集 (触底反弹)：在绝境中，主角发现被忽略的关键线索，或者激发了隐藏的终极能力（例如，揭开真实身世、获得神秘遗产），找到了反败为胜的唯一机会。
            第38-42集 (决战前夜)：主角重整旗鼓，联合所有能联合的力量，制定最终决战的计划。这个阶段悬念迭起，为最终高潮蓄力。
          第四阶段：合 (Conclusion) - 约3/20集(如对于50集短剧占43-50集)
            核心目标：终极对决，尘埃落定。 解决所有悬念，给予观众情感上的最终满足。
            集数规划与关键节点：
            第43-47集 (终极高潮)：主角与终极Boss展开全面对决。所有伏笔和人物关系都在这里得到运用和解决。这是全剧最“爽”的部分，要让反派输得彻底，让主角赢得漂亮。
            第48-50集 (尾声与交代)：用几集的时间来处理结局。主角的最终归宿、其他配角的结局、善恶终有报的价值体现。可以留一个开放式的小尾巴或彩蛋，为第二季或番外做铺垫。

      2、短剧整体要求（最重要的要求）
        1）要求每一集（通常2-3分钟）都必须是一个完整的、能提供高强度刺激观众情绪的单元。
        2）每集 设计 “1个核心事件 + 3个关键节点 (钩子 + 爽/虐点 + 悬念)”，越高强度的爽/虐点或情绪价值提供越能让人满意。其中概念解释如下：
        （1）钩子 (Hook) - 开头15秒左右
            ——作用：抓住眼球，让观众停下来。
            ——设计：必须是强冲突或强悬念。例如：
              ————冲突：角色A突然给了角色B一巴掌。
              ————悬念：主角打开门，看到一个意想不到的人。
              ————反常：富豪男主穿着外卖服出现在女主面前。
        （2）爽点/虐点 (Payoff/Pain Point) - 剧中30-90秒
            ——作用：提供核心情绪价值，这是观众追剧的根本动力。
            ——设计：
              ————爽点：主角成功反击，让反派吃瘪、震惊、被打脸。这是短剧最核心的看点。
              ————虐点：主角被陷害、被误解、陷入困境，激发观众的同情和愤怒。虐点是为了铺垫更大的爽点。
        （3）推进/悬念 (Bridge/Cliffhanger) - 结尾15秒
            ——作用：驱动观众看下一集，是付费转化的关键。
            ——设计：事件看似解决，但立刻抛出新的问题。
              ————新危机：“刚打完脸，手机响了，屏幕上显示着终极Boss的名字。”
              ————新转折：“男主刚救了女主，却冷冷地说‘这是我们最后一次见面’。”
              ————新秘密：“主角在反派的抽屉里，发现了一张自己小时候的照片。” 

      世界架构：{world_building}\n\n人设：{heros}\n\n 上一部分分集提纲：{last_part_episode_plan}\n\n当前 {partname} 部分剧情:{part_summary}\n\n当前部分初步集数规划：{part_plan}\n\n' 
          

optim: '根据以下文章回答问题：({result})，按照{"提纲":xxx}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
    
