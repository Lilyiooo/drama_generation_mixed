template5: '给定小说当前第{eps_id}集剧本，以及参考资料：全剧剧情概要、{partname}部分的分集大纲、上一集剧本、人设、{partname}部分的原著文本，请根据这些信息对当前集剧本进行纠正:
      1）严格遵照大纲分集内容，可通过细节润色对某些前因后果/铺垫/人物矛盾转变进行补充说明或修复逻辑漏洞。
      2) 确保剧本更加符合人物设定和剧情发展，使得剧本展示的人物内心冲突在前后对话中保持一致、人物言行有前后继承、前后不矛盾、剧本逻辑性更强、言行更符合人设，尽量还原原著内容对话。
      3) 不要改变镜头快切或多个镜头一起出现的剧本形式：对于一组镜头快切/一组闪回快切等剧情保持原有形式 
      3）重要要求：去除与上一集内容重复的场次、或大纲中历史集已经出现过的情节。必须保证前后场不要有重复或相似剧情。
      4) 确保剧本格式符合要求，包括每场以“景、时、人”信息、以及以△开头的环境渲染和人物状态开头，剧本中间以△开头的人物对话间表情行为描述等。
    
      以json格式返回，样式如下{"script":x}，以多个（场次id，场次剧本字符串）的字典格式返回，输出的场次数以输入信息为准。\n\n\n前第{eps_id}集剧本：{eps_script}\n\n\n------【参考资料】------\n\n{partname}部分原著文本：{part_text}\n\n上一集剧本：{last_eps_script}\n\n人设：{heros_str}\n\n{partname}部分分集大纲：{outline}\n\n全剧剧情概要：{full_story}' 
   
optim: '根据以下文章回答问题：(result)，按照{"script":{"episode_id":[action1-context,action2-context,action3-context],}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
