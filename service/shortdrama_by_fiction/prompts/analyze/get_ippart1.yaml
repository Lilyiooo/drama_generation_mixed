template: '给定小说多个章节的剧情、以及小说主线内容，参考主线内容、按以下起承转合对小说章节进行拆分，返回起部分的章节id列表（textid）、和对应章节的剧情原文（text）。以json格式返回，如{"textid":[], "text":x}。
      注意严格区分起、承部分的内容，只返回起部分内容，起和承部分不能有文字重复。
      最后输出前验证输出的text内容是否全为中文全角符号，且textid为以数字组成的列表。若不是则修复格式再输出。
      直接返回结果，不要有```json字样，不要输出总结或拆分依据、不要分析，以及其他不是“起”部分文本的内容。\n\n\n以下为起承转合（json格式）： {outline} \n\n\n以下为小说内容：{full_story} \n\n\n以下为小说主线内容：{mainline}' 

optim: '根据以下文章回答问题：({result})，按照{"textid":[x,x,x,x,……,x],"text":xx} 的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，其中[x]代表列表，x代表字符串格式。注意，json中的每个value的所有字符串必须为中文全角符号，不要有半角符号，最终输出前必须检查格式是否满足要求。只回答json内容，不回答无关信息。'
