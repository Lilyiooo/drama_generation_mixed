# 任务：修改人物设定
template: '仔细阅读以下提供的相关内容，重新生成主要角色的人物设定。

  **要求：**
  1. 新的人物设定需要采纳“修改建议”中的所有要点，并与“小说摘要”的整体故事背景保持一致。
  2. 除非修改建议有额外要求，否则新的人物设定形式上与修改前保持一致，每个角色应该是一段连续的文本，描述其外形、性格特点、喜好、能力、内心冲突、目标动机以及人物关系等。
  3. 返回格式：以json格式返回，如{"人名1":描述文本1,"人名2":描述文本2} 

  **1. 集数规划**
  ```
  {Outline}
  ```

  **2. 人物设定 (修改前)：**
  ```
  {RoleInfo}
  ```

  **3. 修改建议：**
  ```
  {Suggestion}
  ```

  **4. 小说摘要：**
  ```
  {ChapterAbstract}
  ```

  请直接输出重新生成的主要角色人物设定，**不要输出其他多余信息**。'

optim: '根据以下文章回答问题：({result})，按照{"人名1":描述文本1,"人名2":描述文本2} 的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'