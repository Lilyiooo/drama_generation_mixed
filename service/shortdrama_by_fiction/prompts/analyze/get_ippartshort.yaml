template1: '给定小说文本，按以下起承转合对小说文本进行拆分，返回起部分的文本。以json格式返回，如{"text":xxx}。
      注意有时候小说会有前言或者剧情总概述一样的前置词，这部分内容一般在小说前几句出现。当小说有前言时，要严格区分前言和起，仅返回起部分内容，不要包含前言。
      注意严格区分起、承部分的内容，只返回起部分内容，起和承部分不能有文字重复。
      直接返回结果，不要有```json字样，不要输出总结或拆分依据、不要分析，以及其他不是“起”部分文本的内容。\n\n\n以下为起承转合（json格式）： {outline} \n\n\n以下为小说内容：{full_story}'
