template5: '要把一个小说故事转换成短剧剧本。已知每个故事都有起、承、转、合。每个环节包含的过程如下:
        起	
          环境规则
          主角登场
          激励事件
          外部目标
          走出舒适区
        承	
          初识红利
          伙伴爱情
          起始对手
          阻力对抗
          故事拐点
        转	
          调整目标
          确认对手
          冲突升级
          第一次决战
          遭受重挫
        合	
          疗伤反省
          解决方案
          牺牲成长
          最终决战
          回到原点
        
        已知对于短剧的四个阶段额外设定包括：
          第一阶段：起 (Introduction) - 约1/5集（如对于50集短剧占10集）
            核心目标：快速入局，抛出核心矛盾。 必须在最短时间内让观众明白：主角是谁？他/她想要什么？最大的障碍是什么？
            集数规划与关键节点：
            第1-2集 (黄金开局)：必须在第1集的前30秒内引爆第一个强冲突。 例如：女主开局就被丈夫和闺蜜背叛/被家族扫地出门/发现自己身患绝症。这部分要快、准、狠，迅速建立观众对主角的同情和对反派的憎恨。
            第3-5集 (确立目标)：主角从最初的打击中缓过神来，确立一个初步的、明确的目标。例如：“我要复仇！”、“我要在三个月内赚到100万！”、“我要找到真相！”。同时，关键人物（如神秘男主、忠心盟友）登场，给予主角初步帮助或提出更具诱惑的条件。
            第6-10集 (初尝胜果与新危机)：主角利用新获得的能力或帮助，完成第一次“打脸”或小规模逆袭，获得第一个“小爽点”，让观众看到希望。但胜利之后，立刻引出更强大的对手或更复杂的危机，为“承”阶段铺路。
          第二阶段：承 (Development/Elaboration) - 约3/10集（如对于50集短剧占11~25集）
            核心目标：升级打怪，爽点密集。 这是故事的主体部分，主角在追求目标的道路上不断清除障碍，能力和地位持续上升。
            集数规划与关键节点：
            节奏：这个阶段是“爽点”最密集的区域。基本保持 3-5集解决一个中级反派或完成一个阶段性目标 的节奏。
            事件设计：设计一系列“打脸”事件。例如：职场上，主角搞定一个又一个刁难的客户和同事；复仇中，主角让一个个欺负过她的配角付出代价。
            感情线发展：主角与核心盟友（通常是男主）的关系在此阶段通过共同经历危机而升温，从互相试探到建立信任。
            第25集左右 (中点事件/假高潮)：设置一个重大的转折点。主角可能取得了阶段性的巨大胜利（例如，扳倒了一个重要敌人，几乎要成功了），让观众以为故事将走向结尾。这通常是一个“假高潮”。
          第三阶段：转 (Turn/Climax) - 约7/20集(如对于50集短剧占26~42集)
            核心目标：矛盾激化，置之死地而后生。 故事急转直下，主角遭遇前所未有的危机，所有矛盾集中爆发。
            集数规划与关键节点：
            第26-32集 (危机降临)：“假高潮”之后，幕后黑手或终极Boss开始发力，主角的计划被识破，或者被最信任的人背叛，瞬间从顶峰跌入谷底。这是故事的“至暗时刻”。
            第33-37集 (触底反弹)：在绝境中，主角发现被忽略的关键线索，或者激发了隐藏的终极能力（例如，揭开真实身世、获得神秘遗产），找到了反败为胜的唯一机会。
            第38-42集 (决战前夜)：主角重整旗鼓，联合所有能联合的力量，制定最终决战的计划。这个阶段悬念迭起，为最终高潮蓄力。
          第四阶段：合 (Conclusion) - 约3/20集(如对于50集短剧占43-50集)
            核心目标：终极对决，尘埃落定。 解决所有悬念，给予观众情感上的最终满足。
            集数规划与关键节点：
            第43-47集 (终极高潮)：主角与终极Boss展开全面对决。所有伏笔和人物关系都在这里得到运用和解决。这是全剧最“爽”的部分，要让反派输得彻底，让主角赢得漂亮。
            第48-50集 (尾声与交代)：用几集的时间来处理结局。主角的最终归宿、其他配角的结局、善恶终有报的价值体现。可以留一个开放式的小尾巴或彩蛋，为第二季或番外做铺垫。

        以下给定小说及其主线故事，请先确定主线故事的核心冲突、大结局剧情，请以小说内容为背景、对主线故事按上述起承转合的每个过程，把故事切分成起承转合四部分，对每个环节的过程进行内容描述，给出理由。
        1、平衡起承转合4部分的有效情节推进量，最好是：起、合部分情节量占比1/8～1/4，承、转情节量占比1/4左右。不得让起部分情节量过少。
        2、围绕核心主线与人物关系，搭建清晰的剧情框架，明确每阶段核心冲突与剧情走向。
        3、规划关键节点：第 1 集需设置强冲突钩子，第 10 集左右（一卡末尾）安排重大转折、高潮或强爽点，每集结尾设计悬念卡点。
        4、确定整体节奏：删减冗余内容，保证情节快速推进，契合短剧 “快节奏、强冲突” 的特性。
        5、具体要求：
        ————初期（如第 1 集）：抓住主线，男女主尽快登场。采用 “冲突前置” 方式，短时间内抛出强冲突、强矛盾事件（如穿越后直接面临生死危机），搭配闪回快速交代背景，瞬间抓住观众注意力。
        ————中期（如第 2-9 集）：保持紧凑节奏，每集聚焦 1 个核心情节，快速推进主线，减少冗长描写，通过动作、表情替代小说中的心理、环境刻画。
        ————卡点节点（如第 10 集左右）：设计强悬念、强期待或强爽点（如身份揭晓、重大变故），将观众期待感拉满，促进付费或解锁广告。
        ————后续阶段：重复 “每集核心情节 + 结尾卡点” 模式，持续强化主线冲突与人物关系张力，直至剧情收尾。
        6、对起承转合每个过程给出短剧化的集数规划建议（每集3到5个情节，时长约5分钟）。进行集数规划时，需要考虑每集1个核心事件（一个完整的、能刺激观众情绪的单元）、3个关键节点 (钩子 + 爽/虐点 + 悬念)的剧情量，保证每部分集数规划情节量合理。
        
        用json格式返回，返回举例{"起:{"环境规则"：x,"主角登场":x, 激励事件:x, 外部目标:x, 走出舒适区:x ,"集数规划":{"总集数建议":"xx","分集内容描述":xx}},  承：{初识红利:x, 伙伴爱情:x, 起始对手:x, 阻力对抗:x, 故事拐点:x,"集数规划":x}, 转：{调整目标:x, 确认对手:x, 冲突升级:x, 第一次决战:x, 遭受重挫:x,"集数规划":x}, 合：{疗伤反省:x, 解决方案:x, 牺牲成长:x, 最终决战:x, 回到原点:x,"集数规划":x}}，注意前后环节的内容要连贯，且不要缺漏，仅返回结果，不要带```json等字样。小说内容如下:\n{full_story}\n\n\n主线故事如下:\n{mainline}'
    

optim: '根据以下文章回答问题：({result})，按照{"起:{"环境规则":x,"主角登场":x, 激励事件:x, 外部目标:x, 走出舒适区:x,"集数规划":x },  承：{初识红利:x, 伙伴爱情:x, 起始对手:x, 阻力对抗:x, 故事拐点:x,"集数规划":x}, 转：{调整目标:x, 确认对手:x, 冲突升级:x, 第一次决战:x, 遭受重挫:x,"集数规划":x}, 合：{疗伤反省:x, 解决方案:x, 牺牲成长:x, 最终决战:x, 回到原点:x,"集数规划":x}}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
    