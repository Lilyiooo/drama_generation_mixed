template2: '要把某部IP改编成短剧剧本，使得最终剧本大获好评。给出小说原文或剧情，设计的世界架构、人设，以及当前的分集短剧提纲，请针对本小说题材根据成功的短剧所具备的元素对当前短剧提纲进行逻辑合理性、所提供的情感价值、观众吸引力等等成功短剧元素方面分析，发现并修复不合理的地方，最后输出新的短剧剧本故事提纲（禁止完全拷贝参考提纲或用对比的故事提纲）。集数规划如下：({eps_plan})——若无特别集数规划，则按总60集、每集3分钟篇幅为目标。
      要求短剧剧本其中：每集3场次的（不超过6句话，每1-2句话代表1个场次剧情，当剧情内容过多时某些集场次数可增加但单集不超过5场次）
      以json格式返回，如{"提纲":xxxx}，其中每部分提纲采用列表分点列出，列表中每项为1集内容，每集有6句以内以句号为划分的话，如["第1集：xxx。","第2集：xx"]。要求：
      1）当前剧情量不足时：要丰富当前剧情的细节。最终提纲需要包含当前部分剧情的所有情节，同时扩展一些本部分情节的适合短剧化的细节（如角色互动动作、角色暧昧表情或言语、与人设和当前情节相关的行为），或对核心矛盾、冲突推进有帮助的生活小插曲（如意味深长的话和微妙的动作、回忆、一些高光高亮心动的戏剧性情节）。但
      2）当前剧情量超过短剧10集每集3场次内容时：需要适当压缩剧情，确保每集内容不超过5场次，并保留核心情节和冲突。要求剧情压缩后尽量保留更适合短剧化的情节（如高度乐、虐、甜、爽、燃、欲、暖的情节），删减掉一些不适合短剧化的情节（如过于平淡的日常生活细节，过于冗长的事件过程、支线和配角的情感发展等）。但必须保证输出部分剧情有逻辑，不要发展突兀。
      3）注意只给出该部分提纲，且必须与给定的剧情一致，不能预测未来的行为、或推进没给出的剧情，不要提前泄漏小说后面的内容，不要破坏小说总体世界架构和人设。
      当原始小说内容特别多（比当前剧情多时）丰富的细节可以来自原始小说内容，但挑选细节时需要在保持当前剧情连贯逻辑合理下、挑选更具备冲突性或可以调动观众情绪的细节填充当前剧情。
      4）输出的内容必须在当前剧情范围内，不可以泄漏后续小说故事情节内容。
      5）最后对输出进行检查，必须保证输出部分剧情有逻辑，不要发展突兀，且必须在当前剧情范围内，不要泄漏小说故事后续。当不符合时进行优化再输出，优化点包括：
      ————（1）第一集第2场之前必须有钩子，如突发危机、强情绪点、悬念，杜绝慢节奏铺垫或嘴炮
      ————（2）每集必须有主角行动或核心矛盾推进解决，不能主角一只嘴炮或独白，且单集只围绕一个核心主题、哉重要人物间发生，具有替代功能的次要人物情节删除。
      ————（3）每个小事件需要闭环或有限留白：要么清晰解决核心冲突，要么留适度留白，避免 “烂尾” 或 “过度开放式”，保证观众有明确的情绪落点。
      ————（4）规避 “时间 / 空间” 矛盾：确保前后集或所有前后场次的剧情时间线清晰；确保空间位置（如对男主住所采用相同描述词如“高档公寓”，而非交替使用“出租屋”、“高档公寓”）清晰，避免观众混淆。
      ————（5）补充 “必要铺垫”，避免 “突兀转折”：剧情反转或关键情节（如 “反派突然变好”“贵人突然相助”）需提前铺垫，不能凭空出现。前后集之间的剧情转折也需有合理过渡，避免观众感到剧情突兀。
      ————（6）删减 “冗余信息”，避免 “信息过载”：删除与主线无关的支线情节或人物，避免观众分心。
      6) 同时保证基础条件：保持结局与主要过程与原始设计的起承转合发展一致（新设计的重场戏例外），所有集剧情不重复、各集前后剧情连续。
      \n\n小说剧情:{full_story}\n\n\n【参考资料】\n\n世界架构：{world_building}\n\n人设：{heros_str}\n\n原始起承转合切分：{outline}\n\n现有短剧分集提纲：{raw_plan}\n\n' 

optim: '根据以下文章回答问题：({result})，按照{"提纲":xxxx}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'

