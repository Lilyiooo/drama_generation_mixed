template: '你是一名专业的小说世界观分析师。你的任务是阅读以下按章节提供的的小说摘要，并从中提取、总结并分类出小说的核心世界观设定。
  要求：
  1. 所有设定必须严格基于提供的摘要内容，如果某些信息不明确，不要进行过多的推测或联想。 不允许出现英文。
  2. 使用json格式返回，如{"world":"x"}， 其中x为 Markdown 格式化的字符串，确保清晰易读。
  3. 直接输出世界观设定，**不要输出其他多余信息**。

  请分析以下小说章节摘要：  
  {full_story}'
optim: '根据以下文章回答问题：({result})，按照({"world":"x"}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
