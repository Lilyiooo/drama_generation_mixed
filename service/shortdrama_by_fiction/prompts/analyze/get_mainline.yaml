template: '请根据以下给定的剧情摘要，按照指定的维度进行深入分析和总结。
      ### 分析维度
      1. **主线剧情**：描述主要角色(一般指男、女主)的情节发展，突出主人公的核心矛盾和转折。
      2. **副线剧情**：描述次要角色的情节线索，及其与主线剧情的关联和影响。

      ### 剧情摘要
      {full_story}

      ### 按戏份的角色列表
      {heros_str}

      ### 输出要求
      请按照上述维度，对剧情进行详细的分析和总结，内容要求结构清晰、语言精炼。不要输出其他信息。以json格式输出，每个分析维度分别输出一段文字，输出格式如下：{"主线剧情":x, "副线剧情":x}'
optim: '根据以下文章回答问题：({result})，按照{"主线剧情":x, "副线剧情":x}的模板尽可能提取出其中类似json格式的段落，并修复不符合json格式的错误，只回答json内容，不回答无关信息'
